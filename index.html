 if(x.p)h+=`<div class="seg">${x.p.map((y,i)=>`<button data-p="${i}" class="${i==p?'on':''}">${y[0]}</button>`).join('')}</div><p class="pn">${x.p[p][1]}</p>`;
 if(x.m)h+=`<p class="pn">${x.m}</p>`;
 h+='<ul class="tl">'+x.s.map((s,i)=>{const key=x.n+'-'+i;return `<li class="st${S.done[key]?' ok':''}${s[4]?' ky':''}"><button class="ck" data-k="${key}" aria-label="標記完成">✓</button><div>${s[0]?`<span class="tm">${s[0]}</span>`:''}<h3>${s[1]}</h3>${s[2]?`<p>${s[2]}</p>`:''}</div>${L(s[3],'mp','地圖')}</li>`}).join('')+'</ul>';
 (x.a||[]).forEach((g,gi)=>{h+=`<div class="al"><h4>${g[0]}</h4>`+g[1].map((c,ci)=>{const key=x.n+'-'+gi+'-'+ci;return `<div class="ri${S.pick[key]?' on':''}"><button data-c="${key}"><b>${c[0]}</b>${c[1]?`<small>${c[1]}</small>`:''}</button>${L(c[3],'pin','📍')}${c[2]?`<p>${c[2]}</p>`:''}</div>`}).join('')+'</div>'});
 h+=`<div class="nv">${cur>0?`<button data-go="-1">‹ 前一天</button>`:''}${cur<D.length-1?`<button class="nx" data-go="1">下一天 ›</button>`:''}</div><button class="rs" data-rs>重設勾選紀錄</button>`;
 $('#day').innerHTML=h;
 const t=$('#tabs'),a=$('.pill.on');t.scrollLeft=a.offsetLeft-t.clientWidth/2+a.clientWidth/2;
 head();
 if(go)$('.dh').scrollIntoView({behavior:'smooth',block:'start'});
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.i!=null){cur=+d.i;render(1)}
 else if(d.k){S.done[d.k]?delete S.done[d.k]:S.done[d.k]=1;sv();render()}
 else if(d.c){S.pick[d.c]?delete S.pick[d.c]:S.pick[d.c]=1;sv();render()}
 else if(d.p!=null){S.plan[D[cur].n]=+d.p;sv();render()}
 else if(d.go){cur+=+d.go;render(1)}
 else if(d.rs!=null){if(d.arm){S.done={};S.pick={};sv();render()}else{b.dataset.arm=1;b.textContent='再點一次確認清除'}}
});
const tz=z=>new Intl.DateTimeFormat('zh-TW',{timeZone:z,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date());
const tick=()=>{try{$('#ck').innerHTML='日本 <b>'+tz('Asia/Tokyo')+'</b>　台灣 <b>'+tz('Asia/Taipei')+'</b>'}catch(e){}};
tick();setInterval(tick,1000);
const CI=[['京都',35.01,135.77],['大阪',34.69,135.5],['奈良',34.69,135.81],['神戶',34.69,135.2]];
const wi=c=>c==0?'☀️':c<3?'🌤':c==3?'☁️':c<50?'🌫':c<68?'🌧':c<78?'❄️':c<83?'🌦':c<87?'❄️':'⛈';
const wl=(c,t)=>`<a href="https://www.google.com/search?q=${encodeURIComponent(c+' 天氣')}" target="_blank" rel="noopener">${c}${t||''}</a>`;
$('#wx').innerHTML='<span>即時天氣</span>'+CI.map(c=>wl(c[0])).join('');
const lw=()=>{try{fetch('https://api.open-meteo.com/v1/forecast?latitude='+CI.map(c=>c[1])+'&longitude='+CI.map(c=>c[2])+'&current=temperature_2m,weather_code&timezone=Asia%2FTokyo').then(r=>r.json()).then(j=>{$('#wx').innerHTML='<span>即時天氣</span>'+CI.map((c,i)=>wl(c[0],' '+wi(j[i].current.weather_code)+Math.round(j[i].current.temperature_2m)+'°')).join('')}).catch(()=>{})}catch(e){}};
lw();setInterval(lw,6e5);
render();
</script>
</body>
</html>
